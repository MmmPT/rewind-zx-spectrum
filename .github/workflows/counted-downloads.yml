name: Publish counted downloads
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/counted-downloads.yml'
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: counted-downloads
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish existing game files without resetting download counts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="downloads-2026-10-31"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Game downloads" --notes "Downloads through these release assets are counted by GitHub from 31 October 2026. Earlier direct downloads are not included. Counts are file downloads, not unique players." --latest
          fi
          for file in downloads/Rewind_Quiz_128K.tap downloads/Rewind_Quiz_128K.sna; do
            name="$(basename "$file")"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Keeping existing asset and its counter: $name"
            else
              gh release upload "$tag" "$file"
            fi
          done
      - name: Publish REWIND 1.1 downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v1.1"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "REWIND 1.1" --notes "Twenty seconds per question. Faster correct answers earn 100 down to 5 points. Includes the aligned TIMER bar, 50 AY tunes and both shuffled modes. The original version 1.0 remains available. Created with ChatGPT / OpenAI Codex." --latest
          fi
          for file in downloads/Rewind_Quiz_v1.1_128K.tap downloads/Rewind_Quiz_v1.1_128K.sna; do
            name="$(basename "$file")"
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
              echo "Keeping existing asset and its counter: $name"
            else
              gh release upload "$tag" "$file"
            fi
          done
